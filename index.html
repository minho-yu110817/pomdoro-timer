<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pure Pomodoro</title>
    <style>
        @font-face {
            font-family: 'KerisKeduLine';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_Line.woff2') format('woff2');
            font-weight: normal;
           font-display: swap;
        }

        :root {
            --bg-color: #121212;
            --text-main: #ffffff;
            --quote-color: #a1a1a6;
            --accent-color: #ff3b30;
            --break-color: #1db954;
            --glow-color: rgba(255, 59, 48, 0.18);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            position: fixed;
            padding: 10vh 0 10vh 0; /* 명언을 내리기 위해 상단 패딩 소폭 증가 */
        }

        /* ✨ 수정된 반원: 가로를 넓히고 타이머 상단에 살짝 닿도록 배치 */
        .bg-glow {
            position: absolute;
            top: 40%; /* 위치를 더 내려서 타이머와 겹치도록 조정 */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px; /* 가로 크기 확대 */
            height: 350px; /* 세로 크기 확대 */
            background: radial-gradient(circle at bottom, var(--glow-color) 0%, rgba(18, 18, 18, 0) 75%);
            border-top-left-radius: 400px;
            border-top-right-radius: 400px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease-in-out, background 0.5s ease;
            z-index: 0;
        }

        @keyframes subtlePulse {
            0% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.98); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.02); }
        }

        body.timer-running .bg-glow {
            opacity: 1;
            animation: subtlePulse 4s infinite alternate ease-in-out;
        }

        /* 상단 명언: 크기 확대 및 위치 하향 */
        .quote-container {
            text-align: center;
            padding: 0 40px;
            z-index: 2;
            user-select: none;
            flex-shrink: 0;
            margin-top: 20px; /* 명언을 아래로 살짝 밀어줌 */
        }
        .quote-text { 
            font-size: 1.4rem; /* 폰트 크기 확대 */
            font-style: italic; 
            line-height: 1.5; 
            margin-bottom: 15px; 
            font-weight: 300;
        }
        .quote-author { font-size: 0.9rem; letter-spacing: 0.3rem; color: var(--quote-color); text-transform: uppercase; }

        #main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            z-index: 2;
            flex-grow: 1;
        }

        #timer {
            font-family: 'KerisKeduLine', sans-serif;
            font-size: clamp(8rem, 35vw, 16rem);
            color: var(--accent-color);
            transition: color 0.5s ease;
            user-select: none;
            line-height: 0.9;
            margin-bottom: 30px;
        }
        #timer.break-mode { color: var(--break-color); }

        .progress-dots { display: flex; gap: 18px; }
        .dot {
            width: 12px; height: 12px; border-radius: 50%;
            background-color: #fff; opacity: 0.1;
            transition: all 0.5s ease;
        }
        .dot.active { opacity: 0.8; transform: scale(1.3); }

        .buttons { 
            display: flex; 
            gap: 20px; 
            z-index: 2;
            flex-shrink: 0;
        }
        .btn {
            outline: none; cursor: pointer; border: none;
            padding: 20px 45px; border-radius: 50px;
            font-size: 1rem; font-weight: 800;
            transition: all 0.2s ease;
            background: #fff; color: #000;
        }
        .btn:active { transform: scale(0.92); }
        .btn-start { 
            background-color: var(--accent-color); 
            color: white; 
            padding: 20px 60px;
            box-shadow: 0 15px 30px rgba(255, 59, 48, 0.2);
        }
        .btn-sub { background: transparent; border: 2px solid rgba(255,255,255,0.2); color: #fff; }

        #finish-modal {
            position: fixed; inset: 0;
            background: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.6s ease;
        }
        #finish-modal.show { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

<div class="bg-glow" id="glow"></div>

<div id="finish-modal">
    <div style="font-size: 2rem; font-weight: 700; margin-bottom: 15px;">Session Ended.</div>
    <div style="font-size: 1.1rem; color: var(--quote-color); margin-bottom: 40px;">모든 세션이 종료되었습니다.</div>
    <button class="btn btn-sub" onclick="closeModal()">Close and Reset</button>
</div>

<div class="quote-container">
    <div class="quote-text">
        "The great pleasure in life is doing what people say you cannot do."<br>
        <span style="font-size: 1rem; font-style: normal; opacity: 0.6; display: block; margin-top: 12px;">
            인생의 큰 즐거움은 사람들이 할 수 없다는 일을 해내는 것이다.
        </span>
    </div>
    <div class="quote-author">— Walter Bagehot</div>
</div>

<div id="main-wrapper">
    <div id="timer">25 : 00</div>
    <div class="progress-dots" id="dots">
        <div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
</div>

<div class="buttons">
    <button class="btn btn-sub" onclick="resetTimer()">RESET</button>
    <button class="btn btn-start" onclick="startTimer()">START</button>
    <button class="btn btn-sub" onclick="pauseTimer()">PAUSE</button>
</div>

<script>
    let timeLeft = 25 * 60;
    let timerId = null;
    let isWorking = true;
    let sessionCount = 1;

    const timerDisplay = document.getElementById('timer');
    const dots = document.querySelectorAll('.dot');
    const modal = document.getElementById('finish-modal');

    function updateDisplay() {
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        timerDisplay.textContent = `${m} : ${s}`;
        
        const color = isWorking ? 'rgba(255, 59, 48, 0.18)' : 'rgba(29, 185, 84, 0.18)';
        document.documentElement.style.setProperty('--glow-color', color);

        if (!isWorking) timerDisplay.classList.add('break-mode');
        else timerDisplay.classList.remove('break-mode');

        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index < sessionCount);
            if (index < sessionCount) {
                dot.style.backgroundColor = isWorking ? 'var(--accent-color)' : 'var(--break-color)';
            } else {
                dot.style.backgroundColor = '#fff';
            }
        });
    }

    function startTimer() {
        if (timerId) return;
        document.body.classList.add('timer-running');
        timerId = setInterval(() => {
            if (--timeLeft < 0) {
                clearInterval(timerId);
                timerId = null;
                document.body.classList.remove('timer-running');
                handleSessionEnd();
            } else {
                updateDisplay();
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerId);
        timerId = null;
        document.body.classList.remove('timer-running');
    }

    function resetTimer() {
        pauseTimer();
        isWorking = true; sessionCount = 1; timeLeft = 25 * 60;
        updateDisplay();
    }

    function handleSessionEnd() {
        if (isWorking) {
            if (sessionCount >= 4) { modal.classList.add('show'); return; }
            isWorking = false; timeLeft = 5 * 60;
        } else {
            sessionCount++; isWorking = true; timeLeft = 25 * 60;
        }
        updateDisplay();
        startTimer();
    }

    function closeModal() { modal.classList.remove('show'); resetTimer(); }

    updateDisplay();
</script>
</body>
</html>
