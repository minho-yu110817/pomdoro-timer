<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pure Pomodoro</title>
    <style>
        /* ✨ TtTogether 폰트 설정 */
        @font-face {
            font-family: 'TtTogether';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/TTTogetherA.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #121212;
            --text-main: #ffffff;
            --quote-color: #a1a1a6;
            --accent-color: #ff3b30;
            --break-color: #1db954;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            position: fixed;
            padding: 13vh 0 14vh 0;
        }

        /* ✨ 명언 섹션: 위치만 아래로 살짝 조정 */
        .quote-container {
            text-align: center;
            padding: 0 40px;
            z-index: 2;
            user-select: none;
            flex-shrink: 0;
            margin-top: 4vh; /* 명언만 아래로 내리기 위한 여백 추가 */
        }
        .quote-text { 
            font-size: 1.1rem; 
            font-style: italic; 
            line-height: 1.5; 
            margin-bottom: 10px; 
            opacity: 0.9;
        }
        .quote-author { font-size: 0.75rem; letter-spacing: 0.2rem; color: var(--quote-color); text-transform: uppercase; }

        #main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            z-index: 2;
            flex-grow: 1;
        }

        #timer {
            font-family: 'TtTogether', sans-serif;
            font-size: clamp(8.5rem, 36vw, 16.5rem); 
            color: var(--accent-color);
            transition: color 0.5s ease;
            user-select: none;
            line-height: 1;
            margin-bottom: 25px;
            filter: url(#noisy-effect);
        }
        #timer.break-mode { color: var(--break-color); }

        .progress-dots { display: flex; gap: 14px; }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background-color: #fff; opacity: 0.1;
            transition: all 0.5s ease;
        }
        .dot.active { opacity: 0.8; transform: scale(1.1); }

        .buttons { 
            display: flex; 
            gap: 15px; 
            z-index: 2;
            flex-shrink: 0;
        }
        .btn {
            outline: none; cursor: pointer; border: none;
            padding: 14px 30px; border-radius: 30px;
            font-size: 0.85rem; font-weight: 700;
            transition: all 0.2s ease;
            background: #fff; color: #000;
        }
        .btn-start { 
            background-color: var(--accent-color); 
            color: white; 
            padding: 14px 45px;
        }
        .btn-start.break-mode {
            background-color: var(--break-color);
        }

        .btn-sub { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; }

        #finish-modal {
            position: fixed; inset: 0;
            background: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.6s ease;
        }
        #finish-modal.show { opacity: 1; pointer-events: auto; }

        .svg-filters {
            position: absolute;
            width: 0;
            height: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

<svg class="svg-filters">
  <filter id="noisy-effect">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="noise" />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" />
  </filter>
</svg>

<div id="finish-modal">
    <div style="font-size: 1.5rem; font-weight: 700; margin-bottom: 10px;">Session Ended.</div>
    <div style="font-size: 0.9rem; color: var(--quote-color); margin-bottom: 30px;">모든 세션이 종료되었습니다.</div>
    <button class="btn btn-sub" onclick="closeModal()">Close and Reset</button>
</div>

<div class="quote-container">
    <div class="quote-text">
        "The great pleasure in life is doing what people say you cannot do."<br>
        <span style="font-size: 0.85rem; font-style: normal; opacity: 0.6; display: block; margin-top: 8px;">
            인생의 큰 희열은 사람들이 할 수 없다는 일을 해내는 것이다.
        </span>
    </div>
    <div class="quote-author">— Walter Bagehot</div>
</div>

<div id="main-wrapper">
    <div id="timer">25 : 00</div>
    <div class="progress-dots" id="dots">
        <div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
</div>

<div class="buttons">
    <button class="btn btn-sub" onclick="resetTimer()">RESET</button>
    <button class="btn btn-start" id="start-btn" onclick="startTimer()">START</button>
    <button class="btn btn-sub" onclick="pauseTimer()">PAUSE</button>
</div>

<script>
    let timeLeft = 25 * 60;
    let timerId = null;
    let isWorking = true;
    let sessionCount = 1;

    const timerDisplay = document.getElementById('timer');
    const startBtn = document.getElementById('start-btn');
    const dots = document.querySelectorAll('.dot');
    const modal = document.getElementById('finish-modal');

    function updateDisplay() {
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        timerDisplay.textContent = `${m} : ${s}`;
        
        if (!isWorking) {
            timerDisplay.classList.add('break-mode');
            startBtn.classList.add('break-mode');
        } else {
            timerDisplay.classList.remove('break-mode');
            startBtn.classList.remove('break-mode');
        }

        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index < sessionCount);
            if (index < sessionCount) {
                dot.style.backgroundColor = isWorking ? 'var(--accent-color)' : 'var(--break-color)';
            } else {
                dot.style.backgroundColor = '#fff';
            }
        });
    }

    function startTimer() {
        if (timerId) return;
        document.body.classList.add('timer-running');
        timerId = setInterval(() => {
            if (--timeLeft < 0) {
                clearInterval(timerId);
                timerId = null;
                document.body.classList.remove('timer-running');
                handleSessionEnd();
            } else {
                updateDisplay();
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerId);
        timerId = null;
        document.body.classList.remove('timer-running');
    }

    function resetTimer() {
        pauseTimer();
        isWorking = true; sessionCount = 1; timeLeft = 25 * 60;
        updateDisplay();
    }

    function handleSessionEnd() {
        if (isWorking) {
            if (sessionCount >= 4) { modal.classList.add('show'); return; }
            isWorking = false; timeLeft = 5 * 60;
        } else {
            sessionCount++; isWorking = true; timeLeft = 25 * 60;
        }
        updateDisplay();
        startTimer();
    }

    function closeModal() { modal.classList.remove('show'); resetTimer(); }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (timerId) {
                pauseTimer();
            } else {
                startTimer();
            }
        }
    });

    updateDisplay();
</script>
</body>
</html>
