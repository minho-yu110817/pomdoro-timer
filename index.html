<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Focus Timer</title>
    <style>
        @font-face {
            font-family: 'KerisKeduLine';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_Line.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #ffffff;
            --text-main: #1d1d1f;
            --quote-color: #86868b;
            --accent-color: #ff3b30;
            --break-color: #1db954;
            --player-bg: #f5f5f7;
            --active-indicator: #1d1d1f;
        }

        [data-theme='dark'] {
            --bg-color: #121212;
            --text-main: #ffffff;
            --quote-color: #a1a1a6;
            --player-bg: #282828;
            --active-indicator: #ffffff;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: all 0.5s ease;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .music-player {
            position: fixed;
            top: 25px;
            display: flex;
            align-items: center;
            background: var(--player-bg);
            padding: 8px 25px;
            border-radius: 50px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            z-index: 10;
        }

        .track-info { flex-grow: 1; display: flex; align-items: center; gap: 12px; }
        .track-status { 
            font-size: 0.65rem; 
            font-weight: 900; 
            letter-spacing: 0.1rem; 
            color: var(--break-color);
            text-transform: uppercase;
        }

        .noise-selector { 
            display: flex; 
            gap: 18px; 
            position: relative;
        }
        .noise-btn {
            background: none; border: none; cursor: pointer;
            font-size: 0.72rem; font-weight: 700;
            color: var(--quote-color);
            padding: 10px 5px;
            transition: color 0.3s ease;
            letter-spacing: 0.05rem;
        }
        .noise-btn.active { color: var(--text-main); }
        
        .indicator {
            position: absolute;
            bottom: 5px;
            height: 2px;
            background: var(--active-indicator);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 2px;
        }

        .theme-btn {
            position: fixed; top: 32px; right: 30px;
            background: none; border: 1.2px solid var(--quote-color);
            color: var(--text-main); padding: 5px 12px;
            border-radius: 20px; cursor: pointer; font-size: 0.7rem; font-weight: 600;
            z-index: 11; opacity: 0.7;
        }

        .quote-container { margin-top: 70px; text-align: center; padding: 0 40px; }
        .quote-text { font-size: 1rem; font-style: italic; margin-bottom: 8px; line-height: 1.5; }
        .quote-author { font-size: 0.7rem; letter-spacing: 0.2rem; color: var(--quote-color); text-transform: uppercase; }

        #main-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: 20px;}
        #timer { font-family: 'KerisKeduLine', sans-serif; font-size: clamp(5rem, 24vw, 11rem); margin: 0; color: var(--accent-color); }
        #timer.break-mode { color: var(--break-color); }
        .session-info { font-size: 0.8rem; margin-bottom: 40px; letter-spacing: 0.3rem; opacity: 0.3; }

        .buttons { display: flex; gap: 15px; }
        .btn {
            outline: none; cursor: pointer; border: none;
            padding: 16px 38px; border-radius: 30px;
            font-size: 0.85rem; font-weight: 800;
            transition: all 0.3s ease;
            background: var(--text-main); color: var(--bg-color);
        }
        .btn-start { background-color: var(--accent-color); color: white; }
        .btn-sub { background: transparent; border: 1.5px solid var(--text-main); color: var(--text-main); opacity: 0.5; }
    </style>
</head>
<body>

<audio id="noiseAudio" loop preload="auto" crossorigin="anonymous"></audio>

<div class="music-player">
    <div class="track-info">
        <div class="track-status" id="play-status">READY</div>
    </div>
    <div class="noise-selector" id="selector">
        <button class="noise-btn active" onclick="changeNoise('rain', this)">RAIN</button>
        <button class="noise-btn" onclick="changeNoise('cafe', this)">CAFE</button>
        <button class="noise-btn" onclick="changeNoise('fire', this)">FIRE</button>
        <button class="noise-btn" onclick="changeNoise('none', this)">NONE</button>
        <div class="indicator" id="indicator"></div>
    </div>
</div>

<button class="theme-btn" onclick="toggleTheme()">MODE</button>

<div class="quote-container">
    <div class="quote-text">
        "The great pleasure in life is doing what people say you cannot do."<br>
        <span style="font-size: 0.85rem; font-style: normal; opacity: 0.6; display: inline-block; margin-top: 5px;">
            인생의 큰 즐거움은 사람들이 '너는 할 수 없어'라고 말하는 일을 해내는 것이다.
        </span>
    </div>
    <div class="quote-author">— Walter Bagehot</div>
</div>

<div id="main-wrapper">
    <div id="timer">25 <span style="font-size: 0.7em; vertical-align: middle; opacity: 0.2;">:</span> 00</div>
    <div class="session-info" id="session-count">ROUND 1 / 4</div>
    
    <div class="buttons">
        <button class="btn btn-sub" onclick="resetTimer()">RESET</button>
        <button class="btn btn-start" onclick="startTimer()">START</button>
        <button class="btn btn-sub" onclick="pauseTimer()">PAUSE</button>
    </div>
</div>

<script>
    // 더 안정적인 공개 오디오 소스로 교체
    const realNoise = {
        rain: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3', // 빗소리와 유사한 부드러운 화이트노이즈 대용
        cafe: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',
        fire: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3',
        none: ''
    };

    // 만약 위 주소도 안나온다면 아래 주석을 해제하고 시도해보세요 (샘플 노이즈 사이트들)
    const fallbackNoise = {
        rain: 'https://lasonotheque.org/upload/mp3/1359.mp3', // 실제 빗소리
        cafe: 'https://lasonotheque.org/upload/mp3/0951.mp3', // 사람들 웅성거림
        fire: 'https://lasonotheque.org/upload/mp3/1513.mp3', // 불타는 소리
        none: ''
    };

    let timeLeft = 25 * 60;
    let timerId = null;
    let isWorking = true;
    let currentNoise = 'rain';

    const noiseAudio = document.getElementById('noiseAudio');
    const indicator = document.getElementById('indicator');
    const playStatus = document.getElementById('play-status');
    
    // 초기 소리 설정
    noiseAudio.src = fallbackNoise[currentNoise];
    noiseAudio.volume = 0.4;

    function moveIndicator(btn) {
        indicator.style.width = `${btn.offsetWidth}px`;
        indicator.style.left = `${btn.offsetLeft}px`;
    }

    function changeNoise(type, btn) {
        currentNoise = type;
        document.querySelectorAll('.noise-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        moveIndicator(btn);

        if (type === 'none') {
            noiseAudio.pause();
            if (timerId !== null) playStatus.textContent = "MUTED";
        } else {
            noiseAudio.src = fallbackNoise[type];
            noiseAudio.load(); // 소스 변경 후 강제 로드
            if (timerId !== null) {
                const playPromise = noiseAudio.play();
                if (playPromise !== undefined) {
                    playPromise.then(_ => { playStatus.textContent = "PLAYING"; })
                               .catch(e => { playStatus.textContent = "ERROR"; });
                }
            }
        }
    }

    function updateDisplay() {
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerHTML = `${m} <span style="font-size: 0.7em; vertical-align: middle; opacity: 0.2;">:</span> ${s}`;
        
        if (!isWorking) {
            document.getElementById('timer').classList.add('break-mode');
            if (currentNoise !== 'none') noiseAudio.volume = 0.2;
        } else {
            document.getElementById('timer').classList.remove('break-mode');
            if (currentNoise !== 'none') noiseAudio.volume = 0.4;
        }
    }

    function startTimer() {
        if (timerId !== null) return;
        
        if (currentNoise !== 'none') {
            noiseAudio.play().catch(e => console.log("재생 오류:", e));
            playStatus.textContent = "PLAYING";
        } else {
            playStatus.textContent = "MUTED";
        }

        timerId = setInterval(() => {
            timeLeft--;
            updateDisplay();
            if (timeLeft === 0) {
                clearInterval(timerId);
                timerId = null;
                handleSessionEnd();
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerId);
        timerId = null;
        noiseAudio.pause();
        playStatus.textContent = "PAUSED";
    }

    function resetTimer() {
        pauseTimer();
        isWorking = true;
        timeLeft = 25 * 60;
        playStatus.textContent = "READY";
        updateDisplay();
    }

    function handleSessionEnd() {
        isWorking = !isWorking;
        timeLeft = isWorking ? 25 * 60 : 5 * 60;
        updateDisplay();
        startTimer();
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        document.documentElement.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
    }

    window.onload = () => moveIndicator(document.querySelector('.noise-btn.active'));

    updateDisplay();
</script>

</body>
</html>
