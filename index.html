<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Focus</title>
    <style>
        @font-face {
            font-family: 'KerisKeduLine';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_Line.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #fcfcfc;
            --text-main: #1d1d1f;
            --accent-color: #ff3b30;
            --break-color: #1db954;
            --sub-text: #86868b;
            --btn-bg: #f5f5f7;
        }

        [data-theme='dark'] {
            --bg-color: #121212;
            --text-main: #ffffff;
            --sub-text: #a1a1a6;
            --btn-bg: #1c1c1e;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            letter-spacing: -0.02em;
        }

        /* 상단 테마 버튼 */
        .theme-btn {
            position: fixed; top: 40px; right: 40px;
            background: none; border: 1px solid var(--sub-text);
            color: var(--sub-text); padding: 8px 18px;
            border-radius: 30px; cursor: pointer; font-size: 0.75rem; 
            font-weight: 500; transition: 0.3s;
        }
        .theme-btn:hover { border-color: var(--text-main); color: var(--text-main); }

        /* 명언 섹션: 간격 확장 및 한글 추가 */
        .quote-wrapper {
            text-align: center;
            margin-bottom: 80px; /* 타이머와의 간격 확보 */
            padding: 0 20px;
            max-width: 600px;
        }
        .quote-ko {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .quote-en {
            font-size: 0.9rem;
            color: var(--sub-text);
            font-style: italic;
            letter-spacing: 0;
        }

        /* 상태 라벨 */
        .status-badge {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            padding: 6px 12px;
            margin-bottom: 20px;
            color: var(--sub-text);
            transition: color 0.3s;
        }

        /* 타이머 숫자: 압도적인 크기 */
        #timer {
            font-family: 'KerisKeduLine', sans-serif;
            font-size: clamp(8rem, 35vw, 18rem);
            line-height: 0.8;
            margin: 0;
            color: var(--text-main);
            transition: color 0.5s ease;
        }
        #timer.focus-active { color: var(--accent-color); }
        #timer.break-active { color: var(--break-color); }

        /* 컨트롤 버튼 그룹 */
        .controls {
            margin-top: 100px; /* 타이머 하단 간격 대폭 확대 */
            display: flex;
            gap: 24px;
        }

        .btn {
            outline: none; cursor: pointer; border: none;
            padding: 20px 50px; border-radius: 50px;
            font-size: 0.95rem; font-weight: 700;
            transition: all 0.3s ease;
            background: var(--btn-bg);
            color: var(--text-main);
        }
        .btn:hover { transform: translateY(-3px); background: var(--text-main); color: var(--bg-color); }
        
        .btn-start { 
            background: var(--accent-color); 
            color: white; 
            box-shadow: 0 15px 30px rgba(255, 59, 48, 0.15);
        }
        .btn-start:hover { background: #e0352b; color: white; }

    </style>
</head>
<body>

<button class="theme-btn" onclick="toggleTheme()">THEME</button>

<div class="quote-wrapper">
    <div class="quote-ko">"가장 위대한 영광은 한 번도 실패하지 않음이 아니라, 실패할 때마다 다시 일어서는 데 있다."</div>
    <div class="quote-en">The greatest glory lies not in never falling, but in rising every time we fall.</div>
</div>

<div class="status-badge" id="status">Ready</div>
<div id="timer">25:00</div>

<div class="controls">
    <button class="btn" onclick="resetTimer()">RESET</button>
    <button class="btn btn-start" id="startBtn" onclick="startTimer()">START</button>
    <button class="btn" onclick="pauseTimer()">PAUSE</button>
</div>

<script>
    let timeLeft = 25 * 60;
    let timerId = null;
    let isWorking = true;

    const timerDisplay = document.getElementById('timer');
    const statusLabel = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');

    function updateDisplay() {
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        timerDisplay.textContent = `${m}:${s}`;
        
        if (timerId) {
            if (isWorking) {
                timerDisplay.className = 'focus-active';
                statusLabel.textContent = "Focusing";
                statusLabel.style.color = "var(--accent-color)";
            } else {
                timerDisplay.className = 'break-active';
                statusLabel.textContent = "Resting";
                statusLabel.style.color = "var(--break-color)";
            }
        } else {
            timerDisplay.className = '';
            statusLabel.textContent = isWorking ? "Ready to Focus" : "Taking a Break";
            statusLabel.style.color = "var(--sub-text)";
        }
    }

    function startTimer() {
        if (timerId !== null) return;
        startBtn.style.display = "none";
        timerId = setInterval(() => {
            timeLeft--;
            updateDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerId);
                timerId = null;
                handleModeSwitch();
            }
        }, 1000);
        updateDisplay();
    }

    function pauseTimer() {
        clearInterval(timerId);
        timerId = null;
        startBtn.style.display = "block";
        startBtn.textContent = "RESUME";
        updateDisplay();
    }

    function resetTimer() {
        pauseTimer();
        isWorking = true;
        timeLeft = 25 * 60;
        startBtn.textContent = "START";
        updateDisplay();
    }

    function handleModeSwitch() {
        isWorking = !isWorking;
        timeLeft = isWorking ? 25 * 60 : 5 * 60;
        updateDisplay();
        startTimer();
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        document.documentElement.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
    }

    updateDisplay();
</script>

</body>
</html>
