<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pure Pomodoro</title>
    <style>
        @font-face {
            font-family: 'KerisKeduLine';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_Line.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            /* 라이트 모드 제거 및 다크 모드 전용 설정 */
            --bg-color: #121212;
            --text-main: #ffffff;
            --quote-color: #a1a1a6;
            --accent-color: #ff3b30;
            --break-color: #1db954;
            --glow-color: rgba(255, 59, 48, 0.15);
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* 스크롤 절대 방지 */
            overflow: hidden;
            position: fixed;
            left: 0;
            top: 0;
        }

        /* ✨ 반원 형태의 후광(Glow) - 크기 유지 */
        .bg-glow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 400px;
            background: radial-gradient(circle at top, var(--glow-color) 0%, rgba(18, 18, 18, 0) 80%);
            border-bottom-left-radius: 700px;
            border-bottom-right-radius: 700px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            z-index: 0;
        }

        @keyframes subtlePulse {
            0% { opacity: 0.3; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        body.timer-running .bg-glow {
            opacity: 1;
            animation: subtlePulse 4s infinite alternate ease-in-out;
        }

        /* 명언 섹션 */
        .quote-container {
            margin-bottom: 60px;
            text-align: center;
            padding: 0 30px;
            position: relative;
            z-index: 2;
            user-select: none;
        }
        .quote-text { 
            font-size: 1rem; font-style: italic; color: var(--text-main); 
            margin-bottom: 12px; line-height: 1.5;
        }
        .quote-author { font-size: 0.7rem; letter-spacing: 0.15rem; color: var(--quote-color); text-transform: uppercase; }

        /* 메인 타이머 섹션 */
        #main-wrapper {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; position: relative; z-index: 2;
        }

        #timer {
            font-family: 'KerisKeduLine', sans-serif;
            font-size: clamp(6rem, 28vw, 13rem);
            margin: 20px 0; color: var(--accent-color);
            transition: color 0.5s ease;
            user-select: none;
        }
        #timer.break-mode { color: var(--break-color); }

        .progress-dots { display: flex; gap: 12px; margin-bottom: 80px; }
        .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background-color: var(--text-main); opacity: 0.1;
            transition: all 0.5s ease;
        }
        .dot.active { opacity: 0.8; background-color: var(--accent-color); transform: scale(1.2); }

        /* 버튼 섹션 */
        .buttons { display: flex; gap: 15px; justify-content: center; width: 100%; }
        .btn {
            outline: none; cursor: pointer; border: none;
            padding: 18px 40px; border-radius: 35px;
            font-size: 0.85rem; font-weight: 800;
            transition: all 0.3s ease;
            background: var(--text-main); color: var(--bg-color);
        }
        .btn-start { background-color: var(--accent-color); color: white; box-shadow: 0 10px 20px rgba(255,59,48,0.1); }
        .btn-sub { background: transparent; border: 1.5px solid var(--text-main); color: var(--text-main); opacity: 0.6; }

        /* 종료 모달 */
        #finish-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.6s ease;
        }
        #finish-modal.show { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

<div class="bg-glow" id="glow"></div>

<div id="finish-modal">
    <div style="font-size: 1.8rem; font-weight: 700; margin-bottom: 15px;">Session Ended.</div>
    <div style="font-size: 0.95rem; color: var(--quote-color); margin-bottom: 40px;">모든 세션이 종료되었습니다.</div>
    <button class="btn btn-sub" onclick="closeModal()">Close and Reset</button>
</div>

<div class="quote-container">
    <div class="quote-text">
        "The great pleasure in life is doing what people say you cannot do."<br>
        <span style="font-size: 0.85rem; font-style: normal; opacity: 0.7; display: inline-block; margin-top: 8px;">
            인생의 큰 즐거움은 사람들이 '너는 할 수 없어'라고 말하는 일을 해내는 것이다.
        </span>
    </div>
    <div class="quote-author">— Walter Bagehot</div>
</div>

<div id="main-wrapper">
    <div id="timer">25 <span style="font-size: 0.7em; vertical-align: middle; opacity: 0.2;">:</span> 00</div>
    <div class="progress-dots">
        <div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="buttons">
        <button class="btn btn-sub" onclick="resetTimer()">RESET</button>
        <button class="btn btn-start" onclick="startTimer()">START</button>
        <button class="btn btn-sub" onclick="pauseTimer()">PAUSE</button>
    </div>
</div>

<script>
    let timeLeft = 25 * 60;
    let timerId = null;
    let isWorking = true;
    let sessionCount = 1;

    const timerDisplay = document.getElementById('timer');
    const dots = document.querySelectorAll('.dot');
    const modal = document.getElementById('finish-modal');

    function updateDisplay() {
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        timerDisplay.innerHTML = `${m} <span style="font-size: 0.7em; vertical-align: middle; opacity: 0.2;">:</span> ${s}`;
        
        if (!isWorking) {
            timerDisplay.classList.add('break-mode');
            document.documentElement.style.setProperty('--glow-color', 'rgba(29, 185, 84, 0.15)');
        } else {
            timerDisplay.classList.remove('break-mode');
            document.documentElement.style.setProperty('--glow-color', 'rgba(255, 59, 48, 0.15)');
        }

        dots.forEach((dot, index) => {
            if (index < sessionCount) {
                dot.classList.add('active');
                dot.style.backgroundColor = isWorking ? 'var(--accent-color)' : 'var(--break-color)';
            } else {
                dot.classList.remove('active');
                dot.style.backgroundColor = 'var(--text-main)';
            }
        });
    }

    function startTimer() {
        if (timerId !== null) return;
        document.body.classList.add('timer-running');
        timerId = setInterval(() => {
            timeLeft--;
            updateDisplay();
            if (timeLeft === 0) {
                clearInterval(timerId);
                timerId = null;
                document.body.classList.remove('timer-running');
                handleSessionEnd();
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerId);
        timerId = null;
        document.body.classList.remove('timer-running');
    }

    function resetTimer() {
        pauseTimer();
        isWorking = true; sessionCount = 1; timeLeft = 25 * 60;
        updateDisplay();
    }

    function handleSessionEnd() {
        if (isWorking) {
            if (sessionCount >= 4) { modal.classList.add('show'); return; }
            isWorking = false; timeLeft = 5 * 60;
        } else {
            sessionCount++; isWorking = true; timeLeft = 25 * 60;
        }
        updateDisplay();
        startTimer();
    }

    function closeModal() { modal.classList.remove('show'); resetTimer(); }

    // toggleTheme 함수 제거됨

    updateDisplay();
</script>

</body>
</html>
