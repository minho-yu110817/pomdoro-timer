<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Focus Timer</title>
    <style>
        @font-face {
            font-family: 'KerisKeduLine';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_Line.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            --spotify-black: #121212;
            --spotify-grey: #282828;
            --spotify-green: #1DB954;
            --spotify-light-grey: #b3b3b3;
            --white: #ffffff;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(180deg, #2c3e50 0%, var(--spotify-black) 100%);
            color: var(--white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* 🎵 Spotify Style Music Bar (Top) */
        .spotify-bar {
            position: fixed;
            top: 20px;
            width: 90%;
            max-width: 450px;
            background-color: var(--spotify-grey);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .track-info { display: flex; align-items: center; gap: 12px; }
        .album-art { width: 40px; height: 40px; border-radius: 4px; background: #555; overflow: hidden; }
        .album-art img { width: 100%; height: 100%; object-fit: cover; }
        .text-meta { display: flex; flex-direction: column; }
        .track-name { font-size: 0.85rem; font-weight: 700; color: var(--white); }
        .artist-name { font-size: 0.75rem; color: var(--spotify-light-grey); }

        .playback-controls { display: flex; align-items: center; gap: 15px; }
        .play-btn { 
            background: var(--white); border: none; width: 32px; height: 32px; 
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .play-btn:hover { transform: scale(1.05); }

        /* ⏱️ Timer Section */
        #timer {
            font-family: 'KerisKeduLine', sans-serif;
            font-size: clamp(6rem, 25vw, 12rem);
            color: var(--spotify-green);
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(29, 185, 84, 0.3);
        }
        
        .session-info { font-size: 0.9rem; font-weight: 600; letter-spacing: 0.2rem; color: var(--spotify-light-grey); margin-bottom: 40px; }

        .timer-controls { display: flex; gap: 15px; }
        .btn {
            background: none; border: 2px solid var(--spotify-light-grey); color: var(--white);
            padding: 12px 30px; border-radius: 50px; font-weight: 700; font-size: 0.8rem;
            cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { border-color: var(--white); transform: scale(1.02); }
        .btn-primary { background: var(--spotify-green); border: none; color: var(--spotify-black); }

        /* Hidden YouTube (소리만 사용) */
        #yt-player { position: absolute; width: 1px; height: 1px; left: -9999px; }
    </style>
</head>
<body>

<div id="yt-player"></div>

<div class="spotify-bar">
    <div class="track-info">
        <div class="album-art">
            <img src="https://img.youtube.com/vi/Yuw8TnTei58/0.jpg" alt="Art">
        </div>
        <div class="text-meta">
            <div class="track-name">숲 공기🌿가득 마시며 일하기</div>
            <div class="artist-name" id="music-status">OFFLINE</div>
        </div>
    </div>
    <div class="playback-controls">
        <button class="play-btn" id="master-play" onclick="toggleMusic()">
            <span id="play-icon">▶</span>
        </button>
    </div>
</div>

<div id="timer">25:00</div>
<div class="session-info">FOCUS SESSION</div>

<div class="timer-controls">
    <button class="btn" onclick="resetTimer()">RESET</button>
    <button class="btn btn-primary" onclick="startTimer()">START FOCUS</button>
    <button class="btn" onclick="pauseTimer()">PAUSE</button>
</div>

<script>
    // 1. YouTube API 로드
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('yt-player', {
            videoId: 'Yuw8TnTei58',
            events: {
                'onStateChange': onPlayerStateChange
            }
        });
    }

    let isPlaying = false;
    function toggleMusic() {
        if (!player) return;
        if (isPlaying) {
            player.pauseVideo();
        } else {
            player.playVideo();
        }
    }

    function onPlayerStateChange(event) {
        const statusText = document.getElementById('music-status');
        const playIcon = document.getElementById('play-icon');
        if (event.data == YT.PlayerState.PLAYING) {
            isPlaying = true;
            statusText.textContent = "PLAYING FROM YOUTUBE";
            statusText.style.color = "#1DB954";
            playIcon.textContent = "⏸";
        } else {
            isPlaying = false;
            statusText.textContent = "PAUSED";
            statusText.style.color = "#b3b3b3";
            playIcon.textContent = "▶";
        }
    }

    // 2. 타이머 로직
    let timeLeft = 25 * 60;
    let timerId = null;

    function updateDisplay() {
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer').textContent = `${m}:${s}`;
    }

    function startTimer() {
        if (timerId !== null) return;
        // 타이머 시작 시 음악도 같이 재생
        if (player && !isPlaying) player.playVideo();
        
        timerId = setInterval(() => {
            timeLeft--;
            updateDisplay();
            if (timeLeft === 0) {
                clearInterval(timerId);
                timerId = null;
                alert("Session Finished!");
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerId);
        timerId = null;
        if (player) player.pauseVideo();
    }

    function resetTimer() {
        pauseTimer();
        timeLeft = 25 * 60;
        updateDisplay();
    }

    updateDisplay();
</script>

</body>
</html>
