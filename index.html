<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Focus Timer</title>
    <style>
        @font-face {
            font-family: 'KerisKeduLine';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_Line.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #ffffff;
            --text-main: #1d1d1f;
            --quote-color: #86868b;
            --accent-color: #ff3b30; /* 집중 모드 빨간색 */
            --break-color: #1db954;  /* 휴식 모드 초록색 */
        }

        [data-theme='dark'] {
            --bg-color: #121212;
            --text-main: #ffffff;
            --quote-color: #a1a1a6;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: all 0.5s ease;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* 테마 변경 버튼 */
        .theme-btn {
            position: fixed; top: 30px; right: 30px;
            background: none; border: 1.2px solid var(--quote-color);
            color: var(--text-main); padding: 6px 15px;
            border-radius: 20px; cursor: pointer; font-size: 0.75rem; font-weight: 600;
            z-index: 11; opacity: 0.7; transition: 0.3s;
        }
        .theme-btn:hover { opacity: 1; border-color: var(--text-main); }

        /* 명언 섹션 */
        .quote-container { text-align: center; padding: 0 40px; margin-bottom: 20px; }
        .quote-text { font-size: 1.1rem; font-style: italic; margin-bottom: 10px; line-height: 1.6; }
        .quote-author { font-size: 0.75rem; letter-spacing: 0.2rem; color: var(--quote-color); text-transform: uppercase; }

        /* 타이머 섹션 */
        #main-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; }
        #timer { 
            font-family: 'KerisKeduLine', sans-serif; 
            font-size: clamp(6rem, 28vw, 13rem); 
            margin: 0; 
            color: var(--accent-color); 
            line-height: 1;
        }
        #timer.break-mode { color: var(--break-color); }

        .session-info { 
            font-size: 0.85rem; 
            margin: 20px 0 50px 0; 
            letter-spacing: 0.4rem; 
            opacity: 0.4; 
            font-weight: 600;
        }

        /* 컨트롤 버튼 */
        .buttons { display: flex; gap: 20px; }
        .btn {
            outline: none; cursor: pointer; border: none;
            padding: 18px 45px; border-radius: 35px;
            font-size: 0.9rem; font-weight: 800;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--text-main); color: var(--bg-color);
        }
        .btn:active { transform: scale(0.95); }
        .btn-start { background-color: var(--accent-color); color: white; box-shadow: 0 10px 20px rgba(255, 59, 48, 0.2); }
        .btn-sub { background: transparent; border: 1.5px solid var(--text-main); color: var(--text-main); opacity: 0.6; }
        .btn-sub:hover { opacity: 1; }

    </style>
</head>
<body>

<button class="theme-btn" onclick="toggleTheme()">DARK / LIGHT</button>

<div class="quote-container">
    <div class="quote-text">
        "The great pleasure in life is doing what people say you cannot do."
    </div>
    <div class="quote-author">— Walter Bagehot</div>
</div>

<div id="main-wrapper">
    <div id="timer">25:00</div>
    <div class="session-info" id="session-count">FOCUS SESSION</div>
    
    <div class="buttons">
        <button class="btn btn-sub" onclick="resetTimer()">RESET</button>
        <button class="btn btn-start" id="startBtn" onclick="startTimer()">START</button>
        <button class="btn btn-sub" onclick="pauseTimer()">PAUSE</button>
    </div>
</div>

<script>
    let timeLeft = 25 * 60;
    let timerId = null;
    let isWorking = true;

    const timerDisplay = document.getElementById('timer');
    const sessionDisplay = document.getElementById('session-count');
    const startBtn = document.getElementById('startBtn');

    function updateDisplay() {
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        timerDisplay.textContent = `${m}:${s}`;
        
        if (!isWorking) {
            timerDisplay.classList.add('break-mode');
            sessionDisplay.textContent = "BREAK TIME";
            sessionDisplay.style.color = "var(--break-color)";
        } else {
            timerDisplay.classList.remove('break-mode');
            sessionDisplay.textContent = "FOCUS SESSION";
            sessionDisplay.style.color = "var(--text-main)";
        }
        
        // 브라우저 탭 제목 업데이트
        document.title = `(${m}:${s}) Focus`;
    }

    function startTimer() {
        if (timerId !== null) return;
        
        startBtn.style.opacity = "0.5";
        timerId = setInterval(() => {
            timeLeft--;
            updateDisplay();
            if (timeLeft === 0) {
                clearInterval(timerId);
                timerId = null;
                handleSessionEnd();
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerId);
        timerId = null;
        startBtn.style.opacity = "1";
    }

    function resetTimer() {
        pauseTimer();
        isWorking = true;
        timeLeft = 25 * 60;
        updateDisplay();
    }

    function handleSessionEnd() {
        // 알림음 대신 간단한 진동/알림 (지원되는 경우)
        if (Notification.permission === "granted") {
            new Notification(isWorking ? "휴식 시간입니다!" : "다시 집중할 시간입니다!");
        }

        isWorking = !isWorking;
        timeLeft = isWorking ? 25 * 60 : 5 * 60;
        updateDisplay();
        startTimer(); // 다음 세션 자동 시작
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        document.documentElement.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
    }

    // 초기 표시 업데이트
    updateDisplay();

    // 알림 권한 요청
    if (window.Notification && Notification.permission !== "granted") {
        Notification.requestPermission();
    }
</script>

</body>
</html>
