<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Pomodoro</title>
    <style>
        @font-face {
            font-family: 'KerisKeduLine';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_Line.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #ffffff;
            --text-main: #1d1d1f;
            --quote-color: #86868b;
            --accent-color: #ff3b30;
            --break-color: #1db954;
            --glow-color: rgba(255, 59, 48, 0.05); /* 아주 연한 레드 */
        }

        [data-theme='dark'] {
            --bg-color: #121212;
            --text-main: #ffffff;
            --quote-color: #a1a1a6;
            --glow-color: rgba(255, 59, 48, 1); /* 다크모드에선 살짝 더 보임 */
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: all 0.5s ease;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* ✨ 중앙 상단 은은한 빛 (Glow) */
        .bg-glow {
            position: absolute;
            top: 15%; /* 중앙보다 약간 위 */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--glow-color) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease;
            z-index: 0;
        }

        /* 실행 중일 때만 아주 천천히 깜빡임 */
        @keyframes subtlePulse {
            0% { opacity: 0.2; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }

        body.timer-running .bg-glow {
            opacity: 1;
            animation: subtlePulse 5s infinite alternate ease-in-out;
        }

        .theme-btn {
            position: fixed; top: 30px; right: 30px;
            background: none; border: 1px solid var(--quote-color);
            color: var(--text-main); padding: 6px 14px;
            border-radius: 20px; cursor: pointer; font-size: 0.75rem;
            z-index: 11;
        }

        .quote-container {
            margin-bottom: 60px;
            text-align: center;
            padding: 0 30px;
            position: relative;
            z-index: 2;
        }
        .quote-text { 
            font-size: 1rem; font-style: italic; color: var(--text-main); 
            margin-bottom: 12px; line-height: 1.5;
        }
        .quote-author { font-size: 0.7rem; letter-spacing: 0.15rem; color: var(--quote-color); text-transform: uppercase; }

        #main-wrapper {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; position: relative; z-index: 2;
        }

        #timer {
            font-family: 'KerisKeduLine', sans-serif;
            font-size: clamp(6rem, 28vw, 13rem);
            margin: 20px 0; color: var(--accent-color);
            transition: color 0.5s ease;
        }
        #timer.break-mode { color: var(--break-color); }

        .progress-dots { display: flex; gap: 12px; margin-bottom: 80px; }
        .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background-color: var(--text-main); opacity: 0.1;
            transition: all 0.5s ease;
        }
        .dot.active { opacity: 0.8; background-color: var(--accent-color); transform: scale(1.2); }

        .buttons { display: flex; gap: 15px; justify-content: center; width: 100%; }
        .btn {
            outline: none; cursor: pointer; border: none;
            padding: 18px 40px; border-radius: 35px;
            font-size: 0.85rem; font-weight: 800;
            transition: all 0.3s ease;
            background: var(--text-main); color: var(--bg-color);
        }
        .btn-start { background-color: var(--accent-color); color: white; }
        .btn-sub { background: transparent; border: 1.5px solid var(--text-main); color: var(--text-main); opacity: 0.6; }

        #finish-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.6s ease;
        }
        #finish-modal.show { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

<div class="bg-glow" id="glow"></div> <button class="theme-btn" onclick="toggleTheme()">THEME</button>

<div id="finish-modal">
    <div style="font-size: 1.8rem; font-weight: 700; margin-bottom: 15px;">Session Ended.</div>
    <div style="font-size: 0.95rem; color: var(--quote-color); margin-bottom: 40px;">모든 세션이 종료되었습니다.</div>
    <button class="btn btn-sub" onclick="closeModal()">Close and Reset</button>
</div>

<div class="quote-container">
    <div class="quote-text">
        "The great pleasure in life is doing what people say you cannot do."<br>
        <span style="font-size: 0.85rem; font-style: normal; opacity: 0.7; display: inline-block; margin-top: 8px;">
            인생의 큰 즐거움은 사람들이 '너는 할 수 없어'라고 말하는 일을 해내는 것이다.
        </span>
    </div>
    <div class="quote-author">— Walter Bagehot</div>
</div>

<div id="main-wrapper">
    <div id="timer">25 <span style="font-size: 0.7em; vertical-align: middle; opacity: 0.2;">:</span> 00</div>
    <div class="progress-dots">
        <div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="buttons">
        <button class="btn btn-sub" onclick="resetTimer()">RESET</button>
        <button class="btn btn-start" onclick="startTimer()">START</button>
        <button class="btn btn-sub" onclick="pauseTimer()">PAUSE</button>
    </div>
</div>

<script>
    let timeLeft = 25 * 60;
    let timerId = null;
    let isWorking = true;
    let sessionCount = 1;

    const timerDisplay = document.getElementById('timer');
    const dots = document.querySelectorAll('.dot');
    const modal = document.getElementById('finish-modal');
    const glow = document.getElementById('glow');

    function updateDisplay() {
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        timerDisplay.innerHTML = `${m} <span style="font-size: 0.7em; vertical-align: middle; opacity: 0.2;">:</span> ${s}`;
        
        if (!isWorking) {
            timerDisplay.classList.add('break-mode');
            document.documentElement.style.setProperty('--glow-color', 'rgba(29, 185, 84, 0.03)');
        } else {
            timerDisplay.classList.remove('break-mode');
            document.documentElement.style.setProperty('--glow-color', 'rgba(255, 59, 48, 0.03)');
        }

        dots.forEach((dot, index) => {
            if (index < sessionCount) {
                dot.classList.add('active');
                dot.style.backgroundColor = isWorking ? 'var(--accent-color)' : 'var(--break-color)';
            } else {
                dot.classList.remove('active');
                dot.style.backgroundColor = 'var(--text-main)';
            }
        });
    }

    function startTimer() {
        if (timerId !== null) return;
        document.body.classList.add('timer-running');
        timerId = setInterval(() => {
            timeLeft--;
            updateDisplay();
            if (timeLeft === 0) {
                clearInterval(timerId);
                timerId = null;
                document.body.classList.remove('timer-running');
                handleSessionEnd();
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerId);
        timerId = null;
        document.body.classList.remove('timer-running');
    }

    function resetTimer() {
        pauseTimer();
        isWorking = true; sessionCount = 1; timeLeft = 25 * 60;
        updateDisplay();
    }

    function handleSessionEnd() {
        if (isWorking) {
            if (sessionCount >= 4) { modal.classList.add('show'); return; }
            isWorking = false; timeLeft = 5 * 60;
        } else {
            sessionCount++; isWorking = true; timeLeft = 25 * 60;
        }
        updateDisplay();
        startTimer();
    }

    function closeModal() { modal.classList.remove('show'); resetTimer(); }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        document.documentElement.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
    }

    updateDisplay();
</script>

</body>
</html>
