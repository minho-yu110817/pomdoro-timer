<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pure Pomodoro</title>
    <style>
        @font-face {
            font-family: 'KerisKeduLine';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_Line.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #121212;
            --text-main: #ffffff;
            --quote-color: #a1a1a6;
            --accent-color: #ff3b30;
            --break-color: #1db954;
            --glow-color: rgba(255, 59, 48, 0.15);
        }

        /* 최적화: 여백 제거 및 스크롤 완전 봉쇄 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; /* 스크롤 방지 */
            position: fixed; /* 바운스 스크롤 방지 */
        }

        /* ✨ 최적화된 반원 후광: 화면 너비(vw)에 따라 크기가 변함 */
        .bg-glow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120vw; /* 화면 너비보다 살짝 크게 설정하여 부드럽게 */
            height: 60vw;  /* 너비의 절반으로 반원 유지 */
            max-width: 1400px; /* 너무 커지지 않게 제한 */
            max-height: 700px;
            background: radial-gradient(circle at top, var(--glow-color) 0%, rgba(18, 18, 18, 0) 75%);
            border-bottom-left-radius: 50%;
            border-bottom-right-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease-in-out, background 0.5s ease;
            z-index: 0;
        }

        @keyframes subtlePulse {
            0% { opacity: 0.3; transform: translateX(-50%) scale(0.98); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.02); }
        }

        body.timer-running .bg-glow {
            opacity: 1;
            animation: subtlePulse 4s infinite alternate ease-in-out;
        }

        .quote-container {
            margin-bottom: 5vh;
            text-align: center;
            padding: 0 20px;
            z-index: 2;
            user-select: none;
        }
        .quote-text { font-size: 1rem; font-style: italic; line-height: 1.5; margin-bottom: 8px; }
        .quote-author { font-size: 0.7rem; letter-spacing: 0.15rem; color: var(--quote-color); text-transform: uppercase; }

        #main-wrapper {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; z-index: 2;
        }

        #timer {
            font-family: 'KerisKeduLine', sans-serif;
            font-size: clamp(5rem, 25vw, 12rem);
            margin: 10px 0; color: var(--accent-color);
            transition: color 0.5s ease;
            user-select: none;
        }
        #timer.break-mode { color: var(--break-color); }

        .progress-dots { display: flex; gap: 12px; margin-bottom: 5vh; }
        .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background-color: #fff; opacity: 0.1;
            transition: all 0.5s ease;
        }
        .dot.active { opacity: 0.8; transform: scale(1.2); }

        .buttons { display: flex; gap: 15px; }
        .btn {
            outline: none; cursor: pointer; border: none;
            padding: 15px 35px; border-radius: 30px;
            font-size: 0.8rem; font-weight: 800;
            transition: transform 0.2s ease, opacity 0.2s ease;
            background: #fff; color: #000;
        }
        .btn:active { transform: scale(0.95); }
        .btn-start { background-color: var(--accent-color); color: white; }
        .btn-sub { background: transparent; border: 1px solid #fff; color: #fff; opacity: 0.5; }

        #finish-modal {
            position: fixed; inset: 0;
            background: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.6s ease;
        }
        #finish-modal.show { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

<div class="bg-glow" id="glow"></div>

<div id="finish-modal">
    <div style="font-size: 1.5rem; font-weight: 700; margin-bottom: 10px;">Session Ended.</div>
    <div style="font-size: 0.9rem; color: var(--quote-color); margin-bottom: 30px;">모든 세션이 종료되었습니다.</div>
    <button class="btn btn-sub" onclick="closeModal()">Close and Reset</button>
</div>

<div class="quote-container">
    <div class="quote-text">
        "The great pleasure in life is doing what people say you cannot do."<br>
        <span style="font-size: 0.8rem; font-style: normal; opacity: 0.7; display: block; margin-top: 5px;">
            인생의 큰 즐거움은 사람들이 할 수 없다는 일을 해내는 것이다.
        </span>
    </div>
    <div class="quote-author">— Walter Bagehot</div>
</div>

<div id="main-wrapper">
    <div id="timer">25 : 00</div>
    <div class="progress-dots" id="dots">
        <div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="buttons">
        <button class="btn btn-sub" onclick="resetTimer()">RESET</button>
        <button class="btn btn-start" onclick="startTimer()">START</button>
        <button class="btn btn-sub" onclick="pauseTimer()">PAUSE</button>
    </div>
</div>

<script>
    let timeLeft = 25 * 60;
    let timerId = null;
    let isWorking = true;
    let sessionCount = 1;

    const timerDisplay = document.getElementById('timer');
    const dots = document.querySelectorAll('.dot');
    const modal = document.getElementById('finish-modal');

    function updateDisplay() {
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        timerDisplay.textContent = `${m} : ${s}`;
        
        const color = isWorking ? 'rgba(255, 59, 48, 0.15)' : 'rgba(29, 185, 84, 0.15)';
        document.documentElement.style.setProperty('--glow-color', color);

        if (!isWorking) timerDisplay.classList.add('break-mode');
        else timerDisplay.classList.remove('break-mode');

        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index < sessionCount);
            if (index < sessionCount) {
                dot.style.backgroundColor = isWorking ? 'var(--accent-color)' : 'var(--break-color)';
            } else {
                dot.style.backgroundColor = '#fff';
            }
        });
    }

    function startTimer() {
        if (timerId) return;
        document.body.classList.add('timer-running');
        timerId = setInterval(() => {
            if (--timeLeft < 0) {
                clearInterval(timerId);
                timerId = null;
                document.body.classList.remove('timer-running');
                handleSessionEnd();
            } else {
                updateDisplay();
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerId);
        timerId = null;
        document.body.classList.remove('timer-running');
    }

    function resetTimer() {
        pauseTimer();
        isWorking = true; sessionCount = 1; timeLeft = 25 * 60;
        updateDisplay();
    }

    function handleSessionEnd() {
        if (isWorking) {
            if (sessionCount >= 4) { modal.classList.add('show'); return; }
            isWorking = false; timeLeft = 5 * 60;
        } else {
            sessionCount++; isWorking = true; timeLeft = 25 * 60;
        }
        updateDisplay();
        startTimer();
    }

    function closeModal() { modal.classList.remove('show'); resetTimer(); }

    updateDisplay();
</script>
</body>
</html>
