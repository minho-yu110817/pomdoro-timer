<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Focus Procedural Audio</title>
    <style>
        @font-face {
            font-family: 'KerisKeduLine';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_Line.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #ffffff;
            --text-main: #1d1d1f;
            --quote-color: #86868b;
            --accent-color: #ff3b30;
            --break-color: #1db954;
            --player-bg: #f5f5f7;
            --active-indicator: #1d1d1f;
        }

        [data-theme='dark'] {
            --bg-color: #121212;
            --text-main: #ffffff;
            --quote-color: #a1a1a6;
            --player-bg: #282828;
            --active-indicator: #ffffff;
        }

        body {
            margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; background-color: var(--bg-color); color: var(--text-main);
            transition: all 0.5s ease; font-family: -apple-system, sans-serif; overflow: hidden;
        }

        .music-player {
            position: fixed; top: 25px; display: flex; align-items: center;
            background: var(--player-bg); padding: 10px 25px; border-radius: 50px;
            width: 90%; max-width: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); z-index: 10;
        }

        .track-info { flex-grow: 1; display: flex; flex-direction: column; }
        .track-status { font-size: 0.6rem; font-weight: 900; letter-spacing: 0.1rem; color: var(--break-color); text-transform: uppercase; margin-bottom: 2px; }
        .track-name { font-size: 0.75rem; font-weight: 700; opacity: 0.8; }

        .noise-selector { display: flex; gap: 15px; position: relative; }
        .noise-btn {
            background: none; border: none; cursor: pointer; font-size: 0.7rem; font-weight: 700;
            color: var(--quote-color); padding: 8px 4px; transition: color 0.3s ease;
        }
        .noise-btn.active { color: var(--text-main); }
        
        .indicator {
            position: absolute; bottom: 0px; height: 2px; background: var(--active-indicator);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 2px;
        }

        .theme-btn {
            position: fixed; top: 32px; right: 30px; background: none; border: 1.2px solid var(--quote-color);
            color: var(--text-main); padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 0.7rem; font-weight: 600;
            z-index: 11; opacity: 0.7;
        }

        .quote-container { margin-top: 60px; text-align: center; padding: 0 40px; }
        .quote-text { font-size: 1rem; font-style: italic; margin-bottom: 8px; line-height: 1.5; }
        .quote-author { font-size: 0.7rem; letter-spacing: 0.2rem; color: var(--quote-color); text-transform: uppercase; }

        #main-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: 15px;}
        #timer { font-family: 'KerisKeduLine', sans-serif; font-size: clamp(5rem, 24vw, 11rem); margin: 0; color: var(--accent-color); }
        #timer.break-mode { color: var(--break-color); }
        .session-info { font-size: 0.8rem; margin-bottom: 40px; letter-spacing: 0.3rem; opacity: 0.3; }

        .buttons { display: flex; gap: 15px; }
        .btn {
            outline: none; cursor: pointer; border: none; padding: 16px 38px; border-radius: 30px;
            font-size: 0.85rem; font-weight: 800; transition: all 0.3s ease;
            background: var(--text-main); color: var(--bg-color);
        }
        .btn-start { background-color: var(--accent-color); color: white; }
        .btn-sub { background: transparent; border: 1.5px solid var(--text-main); color: var(--text-main); opacity: 0.5; }
    </style>
</head>
<body>

<div class="music-player">
    <div class="track-info">
        <div class="track-status" id="play-status">READY</div>
        <div class="track-name" id="mode-display">Synthetic Rain</div>
    </div>
    <div class="noise-selector">
        <button class="noise-btn active" id="btn-rain" onclick="changeAmbient('rain', this)">RAIN</button>
        <button class="noise-btn" id="btn-cafe" onclick="changeAmbient('cafe', this)">CAFE</button>
        <button class="noise-btn" id="btn-fire" onclick="changeAmbient('fire', this)">FIRE</button>
        <button class="noise-btn" id="btn-none" onclick="changeAmbient('none', this)">NONE</button>
        <div class="indicator" id="indicator"></div>
    </div>
</div>

<button class="theme-btn" onclick="toggleTheme()">MODE</button>

<div class="quote-container">
    <div class="quote-text">
        "The great pleasure in life is doing what people say you cannot do."<br>
        <span style="font-size: 0.85rem; font-style: normal; opacity: 0.6; display: inline-block; margin-top: 5px;">
            인생의 큰 즐거움은 사람들이 '너는 할 수 없어'라고 말하는 일을 해내는 것이다.
        </span>
    </div>
    <div class="quote-author">— Walter Bagehot</div>
</div>

<div id="main-wrapper">
    <div id="timer">25 <span style="font-size: 0.7em; vertical-align: middle; opacity: 0.2;">:</span> 00</div>
    <div class="session-info" id="session-count">ROUND 1 / 4</div>
    
    <div class="buttons">
        <button class="btn btn-sub" onclick="resetTimer()">RESET</button>
        <button class="btn btn-start" onclick="startTimer()">START</button>
        <button class="btn btn-sub" onclick="pauseTimer()">PAUSE</button>
    </div>
</div>

<script>
    // 🔊 자체 사운드 합성 엔진 (Web Audio API)
    let audioCtx, mainGain, noiseNode, filterNode;
    let currentMode = 'rain';

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            mainGain = audioCtx.createGain();
            mainGain.connect(audioCtx.destination);

            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = noiseBuffer;
            noiseNode.loop = true;

            filterNode = audioCtx.createBiquadFilter();
            noiseNode.connect(filterNode);
            filterNode.connect(mainGain);
            noiseNode.start();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        updateSoundProfile();
    }

    function updateSoundProfile() {
        if (!filterNode) return;
        if (currentMode === 'rain') {
            filterNode.type = 'lowpass'; filterNode.frequency.setTargetAtTime(1200, audioCtx.currentTime, 0.1);
            mainGain.gain.setTargetAtTime(0.08, audioCtx.currentTime, 0.1);
        } else if (currentMode === 'cafe') {
            filterNode.type = 'bandpass'; filterNode.frequency.setTargetAtTime(800, audioCtx.currentTime, 0.1);
            mainGain.gain.setTargetAtTime(0.04, audioCtx.currentTime, 0.1);
        } else if (currentMode === 'fire') {
            filterNode.type = 'lowpass'; filterNode.frequency.setTargetAtTime(400, audioCtx.currentTime, 0.1);
            mainGain.gain.setTargetAtTime(0.12, audioCtx.currentTime, 0.1);
        } else {
            mainGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
        }
    }

    // ⏱️ 타이머 및 UI 로직
    let timeLeft = 25 * 60, timerId = null, isWorking = true;
    const playStatus = document.getElementById('play-status'), indicator = document.getElementById('indicator');

    function changeAmbient(type, btn) {
        currentMode = type;
        document.querySelectorAll('.noise-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        indicator.style.width = `${btn.offsetWidth}px`;
        indicator.style.left = `${btn.offsetLeft}px`;
        document.getElementById('mode-display').textContent = type.toUpperCase();
        if (timerId) { initAudio(); updateSoundProfile(); }
    }

    function updateDisplay() {
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerHTML = `${m} <span style="font-size: 0.7em; vertical-align: middle; opacity: 0.2;">:</span> ${s}`;
        if (!isWorking) document.getElementById('timer').classList.add('break-mode');
        else document.getElementById('timer').classList.remove('break-mode');
    }

    function startTimer() {
        if (timerId !== null) return;
        initAudio();
        playStatus.textContent = currentMode === 'none' ? "MUTED" : "PLAYING";
        timerId = setInterval(() => {
            timeLeft--; updateDisplay();
            if (timeLeft === 0) { clearInterval(timerId); timerId = null; handleSessionEnd(); }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerId); timerId = null;
        if (mainGain) mainGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
        playStatus.textContent = "PAUSED";
    }

    function resetTimer() { pauseTimer(); isWorking = true; timeLeft = 25 * 60; updateDisplay(); }
    function handleSessionEnd() { isWorking = !isWorking; timeLeft = isWorking ? 25 * 60 : 5 * 60; updateDisplay(); startTimer(); }
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        document.documentElement.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
    }

    window.onload = () => {
        const firstBtn = document.getElementById('btn-rain');
        indicator.style.width = `${firstBtn.offsetWidth}px`;
        indicator.style.left = `${firstBtn.offsetLeft}px`;
    };
    updateDisplay();
</script>
</body>
</html>
